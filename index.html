<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技能熟练度追踪器</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="loginContainer" class="container">
        <h1>技能熟练度追踪器</h1>
        <div class="auth-form">
            <h2>用户登录</h2>
            <input type="text" id="username" placeholder="用户名">
            <input type="password" id="password" placeholder="密码">
            <button onclick="login()">登录</button>
            <button onclick="showRegister()">注册新用户</button>
        </div>
    </div>

    <div id="registerContainer" class="container" style="display: none;">
        <h1>技能熟练度追踪器</h1>
        <div class="auth-form">
            <h2>用户注册</h2>
            <input type="text" id="newUsername" placeholder="用户名">
            <input type="password" id="newPassword" placeholder="密码">
            <input type="password" id="confirmPassword" placeholder="确认密码">
            <button onclick="register()">注册</button>
            <button onclick="showLogin()">返回登录</button>
        </div>
    </div>

    <div id="mainContainer" class="container" style="display: none;">
        <div class="user-header">
            <h1>技能熟练度追踪器</h1>
            <div class="user-info">
                <span id="currentUser"></span>
                <button onclick="logout()">退出登录</button>
            </div>
        </div>
        <div class="add-skill">
            <input type="text" id="newSkill" placeholder="输入新技能名称">
            <button onclick="addNewSkill()">添加技能</button>
        </div>
        <div id="skillsContainer"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
